apiVersion: v1
kind: ServiceAccount
metadata: {name: grp-agent, namespace: default}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: grp-agent, namespace: default}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: grp-agent, namespace: default}
subjects: [{kind: ServiceAccount, name: grp-agent, namespace: default}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: grp-agent}
