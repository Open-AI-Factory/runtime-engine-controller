apiVersion: grp.keti.re.kr/v1alpha1
kind: RuntimeAction
metadata: {name: ra-torchrun-scaledown-001}
spec:
  workloadRef: {kind: PyTorchJob, namespace: keti-dev, name: ddp-train-local}
  runtime: pytorch
  action: ScaleDown
  target: {gpuCount: 1}
  safePolicy: {mode: WaitSafePoint, timeoutSeconds: 60}
  adapterMode: torchrun
  adapterOptions:
    script: workloads/train_ddp.py
    initialDp: 2
    warmupIters: 100
    keepRunning: false
  profiling:
    workloadType: training
    weightsGb: 0.0196
    gradientsGb: 0.0196
    optimizerGb: 0.0391
    activationGbPerSample: 0.000035
    globalBatch: 1024
  poolSnapshot: mock/local-gpu-snapshot.yaml
